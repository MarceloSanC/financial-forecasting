# Hooks que espelham `make check` (ruff + mypy) e validam a mensagem de commit
# contra docs/CONVENTIONS.md §4 e docs/GIT-WORKFLOW.md.
#
# Fonte única de versão (issue #222): ruff e mypy rodam pelo `uv run` do venv do
# projeto, a mesma versão (travada no `uv.lock`) e a mesma config (`pyproject.toml`)
# que `make lint`/`make typecheck` usam. Nada de `repo:` remoto com `rev:` próprio:
# um pin aqui diverge do `uv.lock` em silêncio (a #199 mediu ruff 0.6.9 × 0.15.20 e
# mypy 1.11.2 × 2.1.0). `tests/architecture/test_pre_commit_hooks_parity.py` reprova
# a volta de um hook de ruff/mypy com versão própria.
#
# Instalação (uma vez por clone — automatizada em `make setup`):
#     uv run pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg

repos:
  - repo: local
    hooks:
      # Mesmos diretórios de `make lint`/`make fmt`.
      - id: ruff-format
        name: ruff format (venv do projeto)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src|tests|scripts|\.claude/hooks)/

      - id: ruff
        name: ruff check --fix (venv do projeto)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^(src|tests|scripts|\.claude/hooks)/

      # `pass_filenames: false`: roda o mesmo `uv run mypy` de `make typecheck`, com
      # os alvos de `[tool.mypy] files` do pyproject. O `files:` abaixo só decide
      # quando o hook dispara (mudança em algo que o mypy checa ou na config dele).
      - id: mypy
        name: mypy (venv do projeto, alvos do pyproject)
        entry: uv run mypy
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(src/|tests/contract/|tests/fakes/|pyproject\.toml$)

      - id: check-commit-msg
        name: check-commit-msg (Conventional Commits + reserved gates)
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        # Validates the subject of the commit message file passed by git.
        # Rules: docs/CONVENTIONS.md §4(a)/§4(b), docs/GIT-WORKFLOW.md §Commits.
