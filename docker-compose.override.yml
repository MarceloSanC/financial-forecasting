# docker-compose.override.yml — camada de dev/devcontainer (VERSIONADA)
#
# O Docker Compose mescla este arquivo automaticamente sobre docker-compose.yml
# em `docker compose up`/`make docker-up`. O devcontainer também o carrega porque
# está listado em .devcontainer/devcontainer.json (dockerComposeFile).
#
# Conteúdo (NENHUMA credencial no git; as credenciais ficam no host):
#
# 1. Mount de ~/.claude — reaproveita o login do Claude Code do host montando
#    ${USERPROFILE}/.claude em /root/.claude do container, reusando a sessão já
#    autenticada, sem novo código de verificação. Windows-first: ${USERPROFILE}
#    resolve o home do usuário; em host não-Windows ajuste o path do volume.
#
# 2. WATCHFILES_FORCE_POLLING — o reloader do uvicorn (--reload) usa WatchFiles,
#    que depende de inotify. inotify NAO propaga em bind mount do Docker Desktop
#    no Windows/WSL2: o watcher morre com
#      WatchfilesRustInternalError: IO error ... (os error 5) about ["/app"]
#    e derruba o uvicorn — que é o processo principal do container. Container
#    morto = devcontainer do VS Code não anexa ("não carrega"). Forçar polling
#    troca inotify por varredura periódica e resolve.
#
# 3. NODE_EXTRA_CA_CERTS — mecanismo DOCUMENTADO do Claude Code para CA custom
#    (https://code.claude.com/docs/en/network-config). Necessário quando um
#    antivírus/proxy intercepta TLS e re-assina os certificados com uma raiz
#    própria (ex.: "Avast Web/Mail Shield Root"): o Windows confia nela, o
#    container Linux não — e `git fetch` e a API do Claude falham dentro dele.
#    Aponta para o BUNDLE do sistema (não para o .crt direto) porque o
#    postCreateCommand enriquece esse bundle com o que estiver em
#    .devcontainer/certs/ — que é gitignored, por ser específico da máquina.
#    Assim o caminho nunca fica quebrado em clone limpo.
services:
  app:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ${USERPROFILE}/.claude:/root/.claude
