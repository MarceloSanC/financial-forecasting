name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Gate de origem de PRs para main:
  # Como GitHub Free não dá branch protection em repos privados, replicamos a
  # restrição "PRs para main só vêm de develop ou hotfix/*" como required check
  # no CI. Configure este job como Required Status Check em main quando o repo
  # estiver no plano que suportar — ou aceite como gate apenas observacional
  # no Free.
  guard-main-source:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bloquear se origem não for develop ou hotfix/*
        run: |
          head="${{ github.event.pull_request.head.ref }}"
          if [[ "$head" == "develop" || "$head" == hotfix/* ]]; then
            echo "OK: PR para main vindo de '$head'"
          else
            echo "PRs para main só são aceitos de 'develop' ou 'hotfix/*'. Origem: $head" >&2
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    # 30 min (era 15): a Stage 5.4 adiciona ~250-300 MB de instalação nova e a
    # suíte do adapter do TFT faz da ordem de vinte treinos reais em CPU. Subir
    # o teto junto com a dependência evita que o job morra por timeout antes de
    # alguém ler a medição de R1/R2.
    # 60 min (era 30, #206): depois da 7.3 (e2e e memória de H3, piloto da
    # ablação) e da 7.4 (e2e da API), o job foi cancelado a 99 % do pytest nos
    # runs 39665942703 (develop) e 39743444111 (PR #205); localmente o
    # `make check` leva 22-26 min com `-n 4`, e o runner tem menos CPU.
    # 90 min (era 60, #259): depois das Stages 8.x e das issues do TCC o job
    # passou a terminar perto do teto e caiu dos dois lados (32 min em
    # 40242652911; cancelado a 99 % em 40234134619, 40237761307, 40245186014).
    # Não é travamento: no 40245186014 os últimos ~9 min são os parâmetros de
    # test_silver_content_refresh em série no gw0 (~1 min 45 s cada, loadgroup);
    # localmente o `make check` levou 1 h 03 min com `-n 4`.
    timeout-minutes: 90
    # `issues: read` habilita o `gh issue view` do check_stage_issue.py
    # (docs-check) — sem ele o script cai no caminho best-effort e o gate
    # issue-first passa sem verificar nada.
    permissions:
      contents: read
      issues: read
    steps:
      # fetch-depth: 0 — o modo delta-only do check_stage_issue.py precisa do
      # merge-base com origin/develop; num clone raso ele não resolve e cai na
      # varredura completa (fail-safe, mas paga um `gh issue view` por Stage).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # Versão pinada: sem `version:` o setup instala o uv mais recente do dia,
      # e o lock (revision 3) passaria a ser interpretado por um resolvedor que
      # ninguém escolheu. Cache habilitado porque a Stage 5.4 trouxe torch CPU +
      # lightning + scipy + scikit-learn (~250-300 MB de download) — ADR 5.4.0003.
      # A imagem de dev (`Dockerfile`, `COPY --from=ghcr.io/astral-sh/uv:<versão>`)
      # pina a MESMA versão: trocar aqui = trocar lá no mesmo commit.
      # tests/architecture/test_uv_version_parity.py falha se divergirem.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
          enable-cache: true

      # `--locked` FALHA se o uv.lock estiver defasado em relação ao pyproject,
      # em vez de re-resolver em silêncio. Sem isso, o CI poderia instalar um
      # conjunto de versões diferente do que foi revisado no PR — e o cache
      # passaria a chavear num lock que não é o instalado.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Contrato de arquitetura explícito (Stage 1.3): import-linter (.importlinter)
      # espelha docs/LAYOUT.md §3/§6 e quebra o build se o domínio importar
      # pandas/pyarrow/torch ou se a direção de dependência for violada. Roda
      # como step dedicado (visibilidade no log do CI) E dentro de `make check`
      # (gate bloqueante) — o que falha aqui também falha o gate completo.
      - name: Verificar contratos de arquitetura (import-linter)
        run: uv run lint-imports

      - name: Run gate completo (lint + typecheck + layout-check + import-linter + docs-check + tests + coverage)
        env:
          # Autentica o `gh` do check_stage_issue.py (docs-check). Sem isto o
          # script imprime WARN e retorna 0 — o issue-first vira no-op no PR.
          GH_TOKEN: ${{ github.token }}
        run: make check
