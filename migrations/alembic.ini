# alembic.ini — configuração do Alembic para migrations de banco de dados
# Documentação: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Diretório onde ficam os scripts de migration e env.py
script_location = migrations

# Template usado ao gerar novos arquivos de revision
# %(rev)s = hash da revision, %(slug)s = descrição slugificada
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Trunca slugs longos para evitar nomes de arquivo gigantes
truncate_slug_length = 40

# Fuso horário para os timestamps nos nomes dos arquivos
timezone = UTC

# URL de conexão — SOBRESCRITA pelo env.py que lê de Settings
# Não edite aqui: use a variável de ambiente DATABASE_URL
sqlalchemy.url = postgresql://user:pass@localhost:5432/financial_forecasting

[post_write_hooks]
# Formata automaticamente os arquivos de migration gerados com ruff
hooks = ruff
ruff.type = exec
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Configuração de logging do Alembic
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
