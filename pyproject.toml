[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-forecasting"
version = "0.1.0"
description = "Pipeline de previsão probabilística de retornos diários com TFT quantílico, em arquitetura hexagonal e medalhão (bronze/silver/gold). Avaliação estatística confirmatória (pinball, DM/MCS/Holm, calibração e conformal) como serviços de domínio apoiados em bibliotecas validadas contra oráculo; piloto AAPL, multi-asset-ready."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marcelo" }]
dependencies = [
    # Framework HTTP
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # ORM e banco de dados
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Validação e configuração
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Tracking de experimentos (backend SQLite local) — ADR 1.5.0001
    "mlflow>=2.14",
    # Storage medalhão (Parquet) — Stage 2.1 / ADR 2.1.0001/2.1.0002
    # pandas/pyarrow: escrita Parquet particionada Hive (batch-por-partição).
    # duckdb: leitura com partition pruning (overview §11 / ADR 0.0.0022).
    # pandera: contrato declarativo de schema/dtype bronze no write.
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandera>=0.20",
    # Calendário de pregão XNYS/NYSE (sessões + feriados reais) — Stage 2.4 / ADR 2.4.0001
    # Vive SÓ no adapter shared/adapters/out/calendar/; o gate import-linter
    # `calendar-no-exchange-calendars-leak` reprova se vazar para application/domain.
    # Pinado por minor (sessões históricas podem mudar entre versões); uv.lock trava o patch.
    "exchange-calendars>=4.5,<5.0",
    # Origem de candles NÃO-default (live) — Stage 2.2 / ADR 2.2.0002
    # Vive SÓ no adapter features/market_data/adapters/out/yfinance/. Não exige
    # chave de API; o teste de integração usa monkeypatch (nunca rede, I13). A
    # origem default reusa o raw existente (ParquetRawCandleFetcher).
    "yfinance>=0.2",
    # Indicadores técnicos (RSI-Wilder/MACD/EMA) — Stage 3.1 / ADR 0.0.0024
    # Sucessor MANTIDO do pandas-ta==0.4.71b0 (beta, fonte apagada — risco
    # supply-chain, overview §10/§11). Vive SÓ no adapter
    # features/feature_engineering/adapters/out/pandas_ta/; o gate import-linter
    # `domain-purity`/`store-no-storage-leak` reprova se pandas/pandas_ta_classic
    # vazar para application/domain (Task 08). A paridade de fórmula com o old é
    # validada pela fixture-oráculo (a lib é só a origem, não a fonte da verdade).
    # Pinado por minor; uv.lock trava o patch (mesma postura de exchange-calendars/yfinance).
    "pandas-ta-classic>=0.6,<0.7",
    # Baselines estatísticos — estimação do AR(1) APENAS — Stage 5.2 / ADR 5.2.0001
    # `ARIMA(order=(1,0,0), include_mean=True)` (port do `arima` do R) estima
    # (mu, phi, sigma2_eps) atrás do seam `_fit_ar1`; TODA a emissão é fórmula de
    # domínio stdlib-only validada por oráculo. Vive SÓ no adapter
    # features/modeling/adapters/out/statsforecast/; o gate import-linter
    # `modeling-no-statsforecast-leak` (Task 08) reprova se statsforecast/numba/numpy
    # vazar para application/domain. Entra em `dependencies` (NÃO num extra) porque o
    # extra opcional `sentiment` existe para libs de centenas de MB fora do CI (ADR
    # 3.2.0002); aqui a perna `real` do contract test e a quebra intencional da Task 08
    # rodam no CI (`uv sync --extra dev`) — postura exchange-calendars/pandas-ta-classic.
    # Pinado por minor; uv.lock trava o patch. Resolvido: 2.1.1 (sem numba — a 2.x usa
    # `coreforecast` compilado; o risco de 1ª compilação JIT do technical §5 é moot).
    "statsforecast>=2.1,<3.0",
    # GBM quantílico — Stage 5.3 / concept D5-D6 + ADRs 5.3.0001-0002
    # Um booster por (nível × horizonte) via `lgb.train` (API nativa; o wrapper
    # sklearn exigiria o extra `lightgbm[scikit-learn]`). Vive SÓ no adapter
    # features/modeling/adapters/out/lightgbm/; o gate import-linter
    # `modeling-no-lightgbm-leak` (Task 01) reprova vazamento para
    # application/domain. Entra em `dependencies` (NÃO num extra) pelo mesmo
    # racional do statsforecast acima: wheel manylinux ~3.5 MB (vs centenas de
    # MB do extra `sentiment`, ADR 3.2.0002) e a perna real da suite de
    # contrato + prova de quebra do gate rodam no CI. Piso >=4.7 é CORREÇÃO,
    # não higiene: 4.7.0 conserta o percentil da folha com pesos (#7224) — o
    # valor emitido pelo objetivo `quantile` sob sample_weight era incorreto
    # abaixo disso. Requer libgomp.so.1 em runtime (presente no devcontainer;
    # fallback CI: apt-get libgomp1). Pinado por minor; uv.lock trava o patch.
    "lightgbm>=4.7,<5.0",
    # Candidato TFT quantílico — Stage 5.4 / ADR 5.4.0003
    # `torch` + `lightning` + `pytorch-forecasting` vivem SÓ no adapter
    # features/modeling/adapters/out/pytorch_forecasting/; os gates import-linter
    # `modeling-no-torch-leak` e `modeling-no-optuna-leak` reprovam vazamento para
    # application/domain. Entram em `dependencies` (NÃO num extra) por uma razão
    # DIFERENTE da do lightgbm/statsforecast: o TFT é o OBJETO DE ESTUDO do
    # projeto, e "treina em modo quantílico com a grade densa" é o critério de
    # aceite central da 5.4 — deixá-lo verificado só por execução manual tiraria a
    # rede de segurança automática justamente do candidato. Isso ESTREITA o ADR
    # 3.2.0002 na cláusula "o CI nunca instala torch" (o extra `sentiment` segue
    # gateando transformers + os ~400 MB de pesos do FinBERT).
    # O `torch` é resolvido do índice CPU declarado em [[tool.uv.index]] abaixo:
    # a resolução default do PyPI em Linux traz a variante CUDA (vários GB), e
    # nada nesta Stage roda em GPU. Habilitar ROCm no ambiente confirmatório é
    # operação da Stage 5.5 (ADR 5.4.0003 §Alternativa B).
    # Pinados por minor; uv.lock trava o patch (postura de todos os blocos acima).
    "torch>=2.12,<3.0",
    "lightning>=2.5,<2.7",
    "pytorch-forecasting>=1.8,<2.0",
    # Busca exploratória de hiperparâmetros — Stage 5.4 / ADR 5.4.0005
    # Consumido SÓ pelo adapter features/modeling/adapters/out/optuna/, e apenas
    # pela API ask-and-tell (o laço de trials vive no use case RunTftSweep, para
    # que o isolamento exploratório/confirmatório seja auditável na application).
    "optuna>=4.0,<5.0",
    # Oráculos de scoring probabilístico — Stage 6.1 / ADR 6.1.0001
    # Pinball, CRPS_Q e interval score são implementados UMA vez, stdlib-only, no
    # domínio de `evaluation` (implementação de registro); `scikit-learn`
    # (`mean_pinball_loss`) e `scoringrules` (`quantile_score`/`crps_quantile`/
    # `interval_score`) são ORÁCULOS atrás do port-out `ScoringBackend` e vivem SÓ
    # em features/evaluation/adapters/out/scoring/; o gate import-linter
    # `evaluation-no-scoring-lib-leak` reprova vazamento para application/domain.
    # Entram em `dependencies` (NÃO num extra) pelo racional do statsforecast/
    # lightgbm acima: as pernas reais da suíte de contrato `[fake, sklearn,
    # scoringrules]` rodam no CI, sem `skipif`. `scikit-learn` já vinha transitivo
    # (1.9.0 no uv.lock); aqui vira declarado. Pins: `scikit-learn` por major (API
    # estável de `mean_pinball_loss` na série 1.x) e `scoringrules` por minor (0.x, API
    # ainda pode mudar entre minors); o uv.lock trava o patch dos dois.
    "scikit-learn>=1.9,<2.0",
    "scoringrules>=0.11,<0.12",
    # Oráculos de inferência pareada — Stage 6.2 / ADRs 6.2.0003-6.2.0004 e 0.0.0056
    # DM/HLN, Holm e o procedimento 'R' do MCS são implementados UMA vez, stdlib-only,
    # no domínio de `evaluation` (implementação de registro). `statsmodels` é o
    # ORÁCULO de DM (HAC) e Holm (`multipletests`) atrás do port-out
    # `InferenceBackend`; `arch` é o gerador DE REGISTRO dos índices de bootstrap
    # (estacionário/moving-block) e da estimativa b̂_sb de Politis-White atrás do
    # port-out `McsBackend`. Vivem SÓ em features/evaluation/adapters/out/inference/;
    # o gate import-linter `evaluation-no-inference-lib-leak` reprova vazamento para
    # application/domain. Entram em `dependencies` (NÃO num extra) pelo racional do
    # scikit-learn/scoringrules acima: as pernas reais das suítes de contrato
    # `[fake, statsmodels]`/`[fake, arch]` e o teste de integração contra `arch.MCS`
    # rodam no CI, sem `skipif`. `statsmodels` deixa de ser só transitiva (vinha via
    # statsforecast). Pinados por minor (`statsmodels`, 0.x) e por major (`arch`); o
    # uv.lock trava o patch dos dois.
    "arch>=8,<9",
    "statsmodels>=0.15,<0.16",
]

[project.optional-dependencies]
dev = [
    # Testes
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # Paraleliza a suíte (`-n auto`) nos alvos de gate — issue #110 / ADR 0.0.0055.
    # O pytest-cov combina a cobertura dos workers; o gate de 90% continua valendo.
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    # Qualidade de código
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Fitness function de arquitetura — espelha docs/LAYOUT.md §3/§6 (Stage 1.3)
    "import-linter>=2.0",
]
# Extra OPCIONAL de sentimento — Stage 3.2 / ADR 3.2.0002, ESTREITADO pela 5.4.
# ATUALIZADO na Stage 5.4: `torch` saiu deste extra porque virou dependência
# principal (ADR 5.4.0003) — mantê-lo aqui seria uma segunda declaração da mesma
# lib, com piso divergente. O que o extra gateia hoje é `transformers` e, por
# consequência, o download dos ~400 MB de pesos do FinBERT, que continua FORA do
# fluxo unattended: o CI roda `uv sync --locked --extra dev` (sem `transformers`),
# então a coleta de testes não baixa o modelo. O adapter `FinbertSentimentModel`
# mantém o import LAZY (dentro do __init__) e a lógica pura de scoring
# (`scores_from_probs`) segue stdlib-only (concept 3.2 I8/I9/D2/D3). Instalar com:
#     uv sync --extra sentiment
# Vive SÓ no adapter `features/feature_engineering/adapters/out/finbert/`; o gate
# import-linter `sentiment-no-ml-leak` reprova se vazar p/ application/domain.
# Pinado por minor; uv.lock trava o patch.
sentiment = [
    "transformers>=4.40,<5.0",
]

# ---------------------------------------------------------------------------
# uv — índice CPU do PyTorch (Stage 5.4 / ADR 5.4.0003)
# ---------------------------------------------------------------------------
# A resolução default do `torch` no PyPI para Linux traz a variante CUDA (wheel
# de centenas de MB + nvidia-*/triton, mais de 1 GB instalado). Nada nesta Stage
# roda em GPU, e o CI menos ainda — daí o índice CPU explícito.
#
# `explicit = true`: o índice só é usado por pacotes que o referenciam em
# [tool.uv.sources]; nenhum outro pacote é resolvido a partir dele.
#
# O `marker` NÃO é opcional: download.pytorch.org/whl/cpu não publica wheels de
# macOS, e o lock deste projeto é universal — sem o marker, `uv lock` não
# resolve o split darwin.
#
# ATENÇÃO — o que torna isto REPRODUTÍVEL não é a declaração acima sozinha.
# `uv pip install` HONRA `tool.uv.sources` (verificado no uv 0.11.28: só com
# `--no-sources` a resolução volta a trazer o torch CUDA), mas NÃO consome o
# `uv.lock`: ele re-resolve a cada execução. Ou seja, `uv pip` acerta o índice e
# erra o conjunto — pode instalar versões que ninguém revisou no PR. Por isso o
# Makefile, o Dockerfile e o devcontainer instalam com `uv sync --locked`, que é
# a única forma de garantir exatamente o conjunto travado no lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'" }]

[tool.hatch.build.targets.wheel]
# Apenas o pacote src/financial_forecasting é empacotado; scripts/ e tests/ ficam fora
packages = ["src/financial_forecasting"]

# ---------------------------------------------------------------------------
# Ruff — linter e formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear — pega armadilhas comuns
    "UP",  # pyupgrade — moderniza sintaxe
    "SIM", # flake8-simplify — simplifica expressões
    "RUF", # regras específicas do Ruff
    "ANN", # flake8-annotations — força type hints
    "PL",  # pylint (subconjunto portado)
    "TID", # flake8-tidy-imports — proíbe imports relativos implícitos
]
[tool.ruff.lint.isort]
# Garante que imports do pacote local aparecem após libs de terceiros
known-first-party = ["financial_forecasting"]

[tool.ruff.lint.per-file-ignores]
# Stage 3.2 / ADR 3.2.0002: o adapter FinbertSentimentModel importa torch/transformers
# de forma LAZY (dentro do __init__) DE PROPÓSITO — o extra `sentiment` é opcional e o
# CI roda `uv sync --extra dev` (sem torch). Um import no topo do módulo quebraria a
# coleta de testes e o gate de cobertura no CI. PLC0415 (import-should-be-at-top-level)
# é justamente o que NÃO queremos aqui; ignorado só neste arquivo (lazy import é o design).
"src/financial_forecasting/features/feature_engineering/adapters/out/finbert/finbert_sentiment_model.py" = [
    "PLC0415",
]
# Stage 3.5: o composition root wira o SentimentModel por um proxy lazy
# (`_LazyFinbertSentimentModel`) que importa o FinBERT (torch/transformers) DE
# PROPÓSITO dentro de `_ensure`, adiando o carregamento ao 1º uso — mesmo design
# justificado do adapter finbert. PLC0415 ignorado só neste arquivo (lazy import).
"src/financial_forecasting/composition_root.py" = [
    "PLC0415",
]

# ---------------------------------------------------------------------------
# Mypy — checagem estática de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src"]
strict = true
# Permite importar libs sem stubs sem gerar erro
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: testes unitários — sem I/O, sem banco, sem rede",
    "integration: testes de integração — usam banco ou serviços reais",
    "contract: testes de contrato — validam que fakes e reais respeitam o mesmo contrato",
    "e2e: testes de ponta a ponta — sobem a aplicação completa",
    "slow: testes lentos (treino real, modelo pesado) — pulados só no gate T1 com -m 'not slow'; rodam em T2 e em make check/CI (ADR 0.0.0055)",
]

[tool.coverage.run]
# Fixa a medição no pacote de produção (não em "src" genérico).
source = ["src/financial_forecasting"]
# `omit` é a lista AUDITÁVEL do que a cobertura NÃO mede: wiring/DI, entrypoint
# (__main__), e infra herdada do template ainda SEM consumidor (reentra quando
# uma feature a injetar — então passa a contar). Cada entrada é justificada na
# Stage 1.2 (ADR 1.2.0010 D2). `adapters/*` NUNCA entra aqui: adapters têm
# contract test (ADR 0.0.0021) e devem contar.
omit = [
    # entrypoint — __main__, não lógica de domínio/application
    "*/main.py",
    # CARRY 1.2 RESOLVIDO na Stage 1.5: `composition_root.py` e
    # `shared/infrastructure/config/*` (Settings) SAÍRAM do omit — agora têm
    # consumidor real (wire_dependencies instancia Hasher+MlflowTracker;
    # Settings ganhou mlflow_tracking_uri) e teste real exercitando-os
    # (tests/unit/shared/test_composition_root.py, .../config/test_settings.py),
    # contando cobertura ≥90%. Ver concept/technical 1.5 (I7, Task 06).
    # wiring FastAPI — consumido só no Step de API (7.4)
    "*/shared/infrastructure/http/*",
    # boot/config de infra (logging) — não lógica de domínio
    "*/shared/infrastructure/logging/*",
    # Infra herdada do template sem consumidor (adapters `clock`/`uuid_generator`
    # e ports-out stub `clock.py`/`id_generator.py`, [deviation] da §7 do
    # technical 1.2) saiu do omit na #91: `Clock` ganhou fake + contrato
    # [fake, real] (SystemClock é injetado pelo composition root); `IdGenerator`
    # e `Uuid4Generator` foram removidos (port morto, ADR 1.1.0001).
    # fora do pacote de domínio
    "*/migrations/*",
    "*/scripts/*",
    # módulos "contaminados" temporários que tests/architecture/
    # test_import_contracts.py grava DENTRO de src/ e apaga no `finally`; com
    # xdist + pytest-cov, um worker que salva os dados enquanto o arquivo
    # existe o registra como fonte e o `coverage json` (sem -i) erra com
    # "No source for code" depois que ele some (#130).
    "*/_arch_audit_taint*.py",
]

[tool.coverage.report]
# Gate de cobertura — falha o pytest se < 90%. Vale para qualquer invocação
# de pytest --cov (make test, make test-cov, CI). Alinha com CLAUDE.md, README
# e GIT-WORKFLOW.
fail_under = 90
show_missing = true
skip_covered = false
# Linhas defensivas excluídas da contagem (precedente repo antigo, validado):
# não são lógica testável de domínio/application.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise AssertionError",
    "if TYPE_CHECKING:",
    # Corpo de stub de Protocol (métodos de ports-out, ex.: clock.py): a linha
    # que contém SÓ `...`. O padrão PRECISA ser ancorado. Sem `^\s*` e `\s*$`
    # ele casa com qualquer linha que contenha reticências — inclusive
    # anotações de tipo multi-linha como `) -> tuple[float, ...]:` — e, quando
    # a linha casada abre um bloco, o coverage exclui a FUNÇÃO INTEIRA em
    # silêncio. Achado do Checkpoint C da Stage 5.4: com o padrão solto, o
    # `split()` do `walk_forward_splitter` (o algoritmo de purga/embargo) e os
    # `_load_dataset` dos use cases de modeling estavam FORA da medição do gate
    # de 90% — o gate reportava verde sobre código que não media.
    "^\\s*\\.\\.\\.\\s*$",
]
