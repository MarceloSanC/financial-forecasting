[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-forecasting"
version = "0.1.0"
description = "Pipeline de previsão probabilística de retornos diários com TFT quantílico, em arquitetura hexagonal e medalhão (bronze/silver/gold). Avaliação estatística confirmatória (pinball, DM/MCS/Holm, calibração e conformal) como serviços de domínio apoiados em bibliotecas validadas contra oráculo; piloto AAPL, multi-asset-ready."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marcelo" }]
dependencies = [
    # Framework HTTP
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # ORM e banco de dados
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Validação e configuração
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Tracking de experimentos (backend SQLite local) — ADR 1.5.0001
    "mlflow>=2.14",
    # Storage medalhão (Parquet) — Stage 2.1 / ADR 2.1.0001/2.1.0002
    # pandas/pyarrow: escrita Parquet particionada Hive (batch-por-partição).
    # duckdb: leitura com partition pruning (overview §11 / ADR 0.0.0022).
    # pandera: contrato declarativo de schema/dtype bronze no write.
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandera>=0.20",
    # Calendário de pregão XNYS/NYSE (sessões + feriados reais) — Stage 2.4 / ADR 2.4.0001
    # Vive SÓ no adapter shared/adapters/out/calendar/; o gate import-linter
    # `calendar-no-exchange-calendars-leak` reprova se vazar para application/domain.
    # Pinado por minor (sessões históricas podem mudar entre versões); uv.lock trava o patch.
    "exchange-calendars>=4.5,<5.0",
    # Origem de candles NÃO-default (live) — Stage 2.2 / ADR 2.2.0002
    # Vive SÓ no adapter features/market_data/adapters/out/yfinance/. Não exige
    # chave de API; o teste de integração usa monkeypatch (nunca rede, I13). A
    # origem default reusa o raw existente (ParquetRawCandleFetcher).
    "yfinance>=0.2",
    # Indicadores técnicos (RSI-Wilder/MACD/EMA) — Stage 3.1 / ADR 0.0.0024
    # Sucessor MANTIDO do pandas-ta==0.4.71b0 (beta, fonte apagada — risco
    # supply-chain, overview §10/§11). Vive SÓ no adapter
    # features/feature_engineering/adapters/out/pandas_ta/; o gate import-linter
    # `domain-purity`/`store-no-storage-leak` reprova se pandas/pandas_ta_classic
    # vazar para application/domain (Task 08). A paridade de fórmula com o old é
    # validada pela fixture-oráculo (a lib é só a origem, não a fonte da verdade).
    # Pinado por minor; uv.lock trava o patch (mesma postura de exchange-calendars/yfinance).
    "pandas-ta-classic>=0.6,<0.7",
]

[project.optional-dependencies]
dev = [
    # Testes
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Qualidade de código
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Fitness function de arquitetura — espelha docs/LAYOUT.md §3/§6 (Stage 1.3)
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
# Apenas o pacote src/financial_forecasting é empacotado; scripts/ e tests/ ficam fora
packages = ["src/financial_forecasting"]

# ---------------------------------------------------------------------------
# Ruff — linter e formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear — pega armadilhas comuns
    "UP",  # pyupgrade — moderniza sintaxe
    "SIM", # flake8-simplify — simplifica expressões
    "RUF", # regras específicas do Ruff
    "ANN", # flake8-annotations — força type hints
    "PL",  # pylint (subconjunto portado)
    "TID", # flake8-tidy-imports — proíbe imports relativos implícitos
]
[tool.ruff.lint.isort]
# Garante que imports do pacote local aparecem após libs de terceiros
known-first-party = ["financial_forecasting"]

# ---------------------------------------------------------------------------
# Mypy — checagem estática de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src"]
strict = true
# Permite importar libs sem stubs sem gerar erro
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: testes unitários — sem I/O, sem banco, sem rede",
    "integration: testes de integração — usam banco ou serviços reais",
    "contract: testes de contrato — validam que fakes e reais respeitam o mesmo contrato",
    "e2e: testes de ponta a ponta — sobem a aplicação completa",
    "slow: testes lentos — pulados em CI rápido com -m 'not slow'",
]

[tool.coverage.run]
# Fixa a medição no pacote de produção (não em "src" genérico).
source = ["src/financial_forecasting"]
# `omit` é a lista AUDITÁVEL do que a cobertura NÃO mede: wiring/DI, entrypoint
# (__main__), e infra herdada do template ainda SEM consumidor (reentra quando
# uma feature a injetar — então passa a contar). Cada entrada é justificada na
# Stage 1.2 (ADR 1.2.0010 D2). `adapters/*` NUNCA entra aqui: adapters têm
# contract test (ADR 0.0.0021) e devem contar.
omit = [
    # entrypoint — __main__, não lógica de domínio/application
    "*/main.py",
    # CARRY 1.2 RESOLVIDO na Stage 1.5: `composition_root.py` e
    # `shared/infrastructure/config/*` (Settings) SAÍRAM do omit — agora têm
    # consumidor real (wire_dependencies instancia Hasher+MlflowTracker;
    # Settings ganhou mlflow_tracking_uri) e teste real exercitando-os
    # (tests/unit/shared/test_composition_root.py, .../config/test_settings.py),
    # contando cobertura ≥90%. Ver concept/technical 1.5 (I7, Task 06).
    # wiring FastAPI — consumido só no Step de API (7.4)
    "*/shared/infrastructure/http/*",
    # boot/config de infra (logging) — não lógica de domínio
    "*/shared/infrastructure/logging/*",
    # adapters de infra diferidos — ainda sem consumidor nesta Stage;
    # reentram (saem do omit) quando uma feature os injetar
    "*/shared/infrastructure/clock/*",
    "*/shared/infrastructure/uuid_generator/*",
    # ports-out stub (Protocol sem corpo) ainda SEM consumidor nesta Stage:
    # módulo nunca importado por teste, então import+assinatura contam como
    # missed (exclude_lines `...` só cobre o corpo). Diferidos, NÃO adapters —
    # reentram (saem do omit) quando uma feature os injetar com fake+contract
    # test (hex). Ver [deviation] na §7 do technical 1.2.
    "*/shared/application/ports/out/clock.py",
    "*/shared/application/ports/out/id_generator.py",
    # fora do pacote de domínio
    "*/migrations/*",
    "*/scripts/*",
]

[tool.coverage.report]
# Gate de cobertura — falha o pytest se < 90%. Vale para qualquer invocação
# de pytest --cov (make test, make test-cov, CI). Alinha com CLAUDE.md, README
# e GIT-WORKFLOW.
fail_under = 90
show_missing = true
skip_covered = false
# Linhas defensivas excluídas da contagem (precedente repo antigo, validado):
# não são lógica testável de domínio/application.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise AssertionError",
    "if TYPE_CHECKING:",
    # corpo de stub de Protocol (ports out clock.py/id_generator.py): `...`
    "\\.\\.\\.",
]
