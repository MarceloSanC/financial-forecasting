# Baseline declarado dos gates de arquitetura (issue #62; mecanismo em
# `scripts/arch_baseline_lib.py`). Cada entrada é uma violação CONHECIDA, com
# `motivo` e `issue` obrigatórios; violação fora daqui reprova o build; entrada que
# não ocorre mais também reprova ("baseline morto" — remover a linha). Não é
# permissão: é débito medido, e a lista deve encolher.

# ---------------------------------------------------------------------------
# check_fake_parity.py — bloco de LÓGICA idêntico >= 15 linhas entre um fake e um
# adapter. VAZIO de propósito: os #66/#70/#71/#75 consertaram os quatro pares que
# a issue #62 mediu (statsforecast, LightGBM, FakeHasher, TFT); o par do medallion
# store tinha 15 linhas só na assinatura de `write`, que o normalizador descarta.
[fake_parity]
allow = []

# ---------------------------------------------------------------------------
# check_port_coverage.py — port-out sem fake em tests/fakes/** ou sem contract test
# [fake, real]. Chave = nome do Protocol.
[port_coverage]

