#      equivalência interna, o registro de hashes, os ADRs 8.2.0003/8.2.0004 nem o
#      andaime em `tests/`.
#   2ª barreira (pelo texto, `find_forbidden`): título, resumo e ponteiro de entrada
#      citável não casam `CITABLE_FORBIDDEN_PATTERNS`.
# O teste `tests/architecture/test_stage_8_3_repo_files.py` confere o parse, os itens
# herdados obrigatórios (A12), as âncoras e as duas barreiras.
#
# `[finding]` aberto (A12): entrada `[finding]` da §7 de um technical das Stages 5.5, 6.x,
# 7.x, 8.1 ou 8.2 parte (i) sem entrada posterior que a resolva. A varredura está no §7 do
