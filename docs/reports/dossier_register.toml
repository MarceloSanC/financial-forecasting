# Como editar (à mão, versionado):
#   [[entry]]
#   kind = "deviation"   # deviation | finding | pre_anchor | environment | reproduction | internal
#   title = "…"
#   summary = "…"        # descreve o fato; nunca número de modelo da evidência de 2025
#   pointer = "docs/…/arquivo.md#âncora"   # caminho relativo ao repo, normalizado; âncora no
#                                          # estilo GitHub de um cabeçalho real do arquivo
#   status = "open"      # só (e obrigatório) em kind = "finding"
#
# Visibilidade (A17): `kind = "internal"` vai só para `final_traceability_dossier_internal.md`;
# todo outro kind é citável e vai para `final_traceability_dossier.md`.
#   1ª barreira (pela fonte, no `DossierEntry`): entrada citável não aponta para
